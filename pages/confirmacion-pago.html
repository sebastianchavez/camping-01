<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pago confirmado — Camping Pinar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { forest: '#2d5016', 'forest-light': '#3a6b1c', orange: '#ea580c', 'orange-dark': '#c2410c', cream: '#fef3e2', earth: '#78350f' },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['Poppins','system-ui','sans-serif'] }
    }}
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-cream font-sans text-gray-800">

<div id="app-navbar"></div>

<main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="bg-white rounded-2xl shadow-xl p-8 md:p-12 text-center fade-in">

    <div class="w-24 h-24 mx-auto mb-6 rounded-full bg-green-100 flex items-center justify-center">
      <svg class="w-14 h-14 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
      </svg>
    </div>

    <h1 class="font-display text-3xl md:text-4xl font-bold text-forest mb-3">¡Pago realizado con éxito!</h1>
    <p class="text-gray-600 text-lg mb-6">Tu reserva ha sido confirmada. Nos vemos en Camping Pinar.</p>

    <div id="payment-info" class="bg-cream rounded-xl p-6 text-left mb-6"></div>

    <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-8 text-sm text-green-800">
      📧 Te enviamos un comprobante a tu correo electrónico.
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center no-print">
      <button id="btn-print" class="px-6 py-3 bg-forest hover:bg-forest-light text-white font-bold rounded-lg transition shadow-md">
        🖨️ Imprimir comprobante
      </button>
      <a href="perfil.html" class="px-6 py-3 bg-orange hover:bg-orange-dark text-white font-bold rounded-lg transition shadow-md">
        📋 Ver mis reservas
      </a>
      <a href="../index.html" class="px-6 py-3 border border-gray-300 hover:bg-gray-100 font-semibold rounded-lg transition">
        🏠 Volver al inicio
      </a>
    </div>
  </div>
</main>

<div id="app-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/reservations.js"></script>
<script>
if (!requireAuth()) throw new Error('No auth');

const payment = JSON.parse(localStorage.getItem('camping_last_payment') || 'null');
const reservationId = localStorage.getItem('camping_last_paid_reservation');
const r = reservationId ? getReservationById(reservationId) : null;
const slot = document.getElementById('payment-info');

if (!payment || !r) {
  slot.innerHTML = '<p class="text-red-600">No se encontró información del pago.</p>';
} else {
  const base = SERVICES_CATALOG.find(s => s.id === r.alojamientoId);
  slot.innerHTML = `
    <h2 class="font-display text-lg font-bold text-forest mb-4">Comprobante de pago</h2>
    <dl class="space-y-2 text-sm">
      <div class="flex justify-between"><dt class="text-gray-500">N° de operación</dt><dd class="font-mono font-bold text-forest">${payment.operacion}</dd></div>
      <div class="flex justify-between"><dt class="text-gray-500">Fecha</dt><dd>${formatDate(payment.fecha, true)}</dd></div>
      <div class="flex justify-between"><dt class="text-gray-500">Método de pago</dt><dd class="font-semibold">${paymentMethodLabel(payment.metodo)}</dd></div>
      <div class="border-t border-gray-200 pt-2 mt-2"></div>
      <div class="flex justify-between"><dt class="text-gray-500">Reserva</dt><dd class="font-mono font-semibold">${r.id}</dd></div>
      <div class="flex justify-between"><dt class="text-gray-500">Alojamiento</dt><dd>${base ? base.name : '—'}</dd></div>
      <div class="flex justify-between"><dt class="text-gray-500">Fechas</dt><dd>${formatDate(r.checkIn)} → ${formatDate(r.checkOut)}</dd></div>
      <div class="flex justify-between border-t-2 border-forest pt-3 mt-2 text-base">
        <dt class="font-bold text-forest">MONTO PAGADO</dt>
        <dd class="font-bold text-orange text-xl">${formatPEN(payment.monto)}</dd>
      </div>
    </dl>
  `;
}

document.getElementById('btn-print').addEventListener('click', () => window.print());
</script>
</body>
</html>
