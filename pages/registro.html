<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crear cuenta — Camping Pinar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { forest: '#2d5016', 'forest-light': '#3a6b1c', orange: '#ea580c', 'orange-dark': '#c2410c', cream: '#fef3e2', earth: '#78350f' },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['Poppins','system-ui','sans-serif'] }
    }}
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-cream font-sans text-gray-800 min-h-screen flex flex-col">

<div id="app-navbar"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-2xl">
    <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
      <div class="text-center mb-8">
        <span class="text-5xl">🏕️</span>
        <h1 class="font-display text-3xl font-bold text-forest mt-3 mb-2">Crea tu cuenta</h1>
        <p class="text-gray-600 text-sm">Únete a Camping Pinar y reserva tu próxima aventura</p>
      </div>

      <form id="register-form" class="space-y-5" novalidate>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input type="text" id="nombre" required placeholder="Juan"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Apellidos</label>
            <input type="text" id="apellidos" required placeholder="Pérez López"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">DNI / Documento</label>
            <input type="text" id="dni" required maxlength="12" placeholder="12345678"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
            <input type="tel" id="telefono" required placeholder="+56 9 8765 4321"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@correo.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="password" required placeholder="Mínimo 6 caracteres"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirmar contraseña</label>
            <input type="password" id="passwordConfirm" required placeholder="Repite tu contraseña"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
          </div>
        </div>

        <label class="flex items-start gap-2 text-sm text-gray-700">
          <input type="checkbox" id="acepta" required class="mt-1 rounded text-forest focus:ring-forest" />
          <span>Acepto los <a href="terminos.html" target="_blank" class="text-forest font-medium hover:text-orange">términos y condiciones</a> y la <a href="privacidad.html" target="_blank" class="text-forest font-medium hover:text-orange">política de privacidad</a>.</span>
        </label>

        <button type="submit" class="w-full bg-orange hover:bg-orange-dark text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg">
          Crear mi cuenta
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        ¿Ya tienes cuenta?
        <a href="login.html" class="text-forest font-semibold hover:text-orange transition">Inicia sesión</a>
      </p>
    </div>
    <p class="text-center mt-6 text-sm">
      <a href="../index.html" class="text-gray-500 hover:text-forest transition">← Volver al inicio</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const data = {
    nombre: document.getElementById('nombre').value,
    apellidos: document.getElementById('apellidos').value,
    dni: document.getElementById('dni').value,
    telefono: document.getElementById('telefono').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    passwordConfirm: document.getElementById('passwordConfirm').value,
    acepta: document.getElementById('acepta').checked
  };

  document.querySelectorAll('.field-error').forEach(el => el.remove());

  if (!data.acepta) { toast('Debes aceptar los términos y condiciones', 'warn'); return; }

  const r = register(data);
  if (!r.ok) { toast(r.message, 'error'); return; }
  toast('¡Cuenta creada! Bienvenido a Camping Pinar', 'success');
  setTimeout(() => { window.location.href = 'perfil.html'; }, 800);
});
</script>
</body>
</html>
