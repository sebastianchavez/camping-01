<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iniciar sesión — Camping Pinar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { forest: '#2d5016', 'forest-light': '#3a6b1c', orange: '#ea580c', 'orange-dark': '#c2410c', cream: '#fef3e2', earth: '#78350f' },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['Poppins','system-ui','sans-serif'] }
    }}
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-cream font-sans text-gray-800 min-h-screen flex flex-col">

<div id="app-navbar"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
      <div class="text-center mb-8">
        <span class="text-5xl">🏕️</span>
        <h1 class="font-display text-3xl font-bold text-forest mt-3 mb-2">Bienvenido de vuelta</h1>
        <p class="text-gray-600 text-sm">Ingresa tus credenciales para continuar</p>
      </div>

      <form id="login-form" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@correo.com" autocomplete="email"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-gray-600">
            <input type="checkbox" id="remember" class="rounded text-forest focus:ring-forest" />
            Recordarme
          </label>
          <a href="recuperar-password.html" class="text-forest hover:text-orange transition font-medium">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="w-full bg-forest hover:bg-forest-light text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg">
          Iniciar sesión
        </button>
      </form>

      <div class="my-6 flex items-center gap-3 text-xs text-gray-400">
        <span class="flex-1 h-px bg-gray-200"></span> o <span class="flex-1 h-px bg-gray-200"></span>
      </div>

      <p class="text-center text-sm text-gray-600">
        ¿No tienes cuenta?
        <a href="registro.html" class="text-forest font-semibold hover:text-orange transition">Regístrate aquí</a>
      </p>

      <div class="mt-6 p-3 bg-cream border border-orange/20 rounded-xl text-xs text-earth">
        <p class="font-semibold mb-1">🔑 Usuario demo:</p>
        <p>Email: <span class="font-mono">demo@camping.com</span></p>
        <p>Contraseña: <span class="font-mono">123456</span></p>
      </div>
    </div>
    <p class="text-center mt-6 text-sm">
      <a href="../index.html" class="text-gray-500 hover:text-forest transition">← Volver al inicio</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const remember = document.getElementById('remember').checked;

  document.querySelectorAll('.field-error').forEach(el => el.remove());
  [email, password].forEach(el => el.classList.remove('border-red-500'));

  let hasError = false;
  if (!isEmail(email.value)) { setFieldError(email, 'Ingresa un correo válido'); hasError = true; }
  if (!password.value.trim()) { setFieldError(password, 'Ingresa tu contraseña'); hasError = true; }
  if (hasError) return;

  const r = login(email.value, password.value, remember);
  if (!r.ok) {
    toast(r.message, 'error');
    return;
  }
  toast('Sesión iniciada correctamente', 'success');
  setTimeout(() => { window.location.href = 'perfil.html'; }, 700);
});

const remembered = localStorage.getItem('camping_remember');
if (remembered) document.getElementById('email').value = remembered;
</script>
</body>
</html>
