<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recuperar contraseña — Camping Pinar</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { forest: '#2d5016', 'forest-light': '#3a6b1c', orange: '#ea580c', 'orange-dark': '#c2410c', cream: '#fef3e2', earth: '#78350f' },
      fontFamily: { sans: ['Inter','system-ui','sans-serif'], display: ['Poppins','system-ui','sans-serif'] }
    }}
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="bg-cream font-sans text-gray-800 min-h-screen flex flex-col">

<div id="app-navbar"></div>

<main class="flex-1 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl p-8 fade-in">
      <div class="text-center mb-8">
        <span class="text-5xl">🔐</span>
        <h1 class="font-display text-3xl font-bold text-forest mt-3 mb-2">Recuperar contraseña</h1>
        <p class="text-gray-600 text-sm">Te enviaremos un enlace para restablecer tu contraseña</p>
      </div>

      <form id="recover-form" class="space-y-5" novalidate>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico</label>
          <input type="email" id="email" required placeholder="tu@correo.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-forest focus:border-transparent transition" />
        </div>

        <button type="submit" class="w-full bg-forest hover:bg-forest-light text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg">
          Enviar enlace de recuperación
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        ¿Recordaste tu contraseña?
        <a href="login.html" class="text-forest font-semibold hover:text-orange transition">Inicia sesión</a>
      </p>
    </div>
    <p class="text-center mt-6 text-sm">
      <a href="../index.html" class="text-gray-500 hover:text-forest transition">← Volver al inicio</a>
    </p>
  </div>
</main>

<div id="app-footer"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/main.js"></script>
<script src="../assets/js/auth.js"></script>
<script>
document.getElementById('recover-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const emailEl = document.getElementById('email');
  document.querySelectorAll('.field-error').forEach(el => el.remove());
  if (!isEmail(emailEl.value)) { setFieldError(emailEl, 'Ingresa un correo válido'); return; }

  const r = recoverPassword(emailEl.value);
  toast(r.message, 'success');
  emailEl.value = '';
});
</script>
</body>
</html>
